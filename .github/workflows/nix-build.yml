name: "Build ctrees under nix"
on:
  pull_request:
  push:
jobs:
  tests:
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: "write"
      contents: "read"
    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@v19
    - uses: DeterminateSystems/magic-nix-cache-action@v13
    - uses: DeterminateSystems/flake-checker-action@v12
    - name: Run nix build
      run: nix build .
